<title>Buchwaage Seite 81</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Aufgabenwahl oben, links die Waage mit Gleichung, rechts der Rechenweg, unten die Bedienung. */
:root{--bg:#f6f7f9;--fg:#1b1d21;--card:#fff;--line:#d5d9e0;--beam:#3a3d44;--stand:#8a8f99;--pivot:#555a66;--blk:#5b9bd5;--blks:#1f4e79;--ball:#e3a283;--balls:#8a4f36;--ok:#1a7f3c;--bad:#b3261e;--warn:#a85a00;--accent:#2563c9;--soft:#eaf0fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f0f10;--fg:#eceef2;--card:#1a1b1e;--line:#33353b;--beam:#f0f0f0;--stand:#46484d;--pivot:#a0a4ae;--ok:#58d17c;--bad:#ff8a80;--warn:#ffb86b;--accent:#6aa5f5;--soft:#202a3d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f0f10;--fg:#eceef2;--card:#1a1b1e;--line:#33353b;--beam:#f0f0f0;--stand:#46484d;--pivot:#a0a4ae;--ok:#58d17c;--bad:#ff8a80;--warn:#ffb86b;--accent:#6aa5f5;--soft:#202a3d}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
main{max-width:1200px;margin:0 auto;padding-block:8px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;min-height:560px;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:1rem;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
button.tab{font-weight:700;padding:8px 18px}
button.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
button.add{border-color:var(--ok)}button.rem{border-color:var(--bad)}
button:disabled{opacity:.4;cursor:default}
input[type=number],input[type=text]{width:4em;font:inherit;font-size:1.15rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-align:center}
#task{font-size:1rem;line-height:1.35}
.hf{display:inline-block;margin-top:4px;font-weight:700;color:var(--warn)}
.mid{display:flex;gap:8px;flex:1 1 0;min-height:0}
.scale{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column}
#eq{font-size:clamp(1.5rem,5.5vh,2.8rem);font-weight:700;text-align:center;line-height:1.2;min-height:1.2em;font-variant-numeric:tabular-nums}
#eq.hid{opacity:.25}
svg{width:100%;flex:1;min-height:0;display:block}
#beam{transform-box:view-box;transform-origin:500px 200px;transition:transform 1.2s cubic-bezier(.3,1.5,.5,1)}
#stat{font-size:1.15rem;font-weight:700;min-height:1.4em;text-align:center}
#stat.ok{color:var(--ok)}#stat.bad{color:var(--bad)}
#rw{flex:0 0 clamp(280px,32%,400px);display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
.rwh{font-weight:700}
#steps{flex:1;min-height:0;overflow:auto;font-size:clamp(1.05rem,3vh,1.6rem);font-variant-numeric:tabular-nums}
.st{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.st.last{font-weight:700}
.sop{color:var(--accent);white-space:nowrap}
.sop.warn{color:var(--warn)}
.ne{color:var(--bad)}
#stock{font-weight:700}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.grp b{margin-right:4px}
.lab{opacity:.85}
#msg{font-weight:600;min-height:1.3em}
#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}
.gone{display:none}
@media (max-width:820px){.mid{flex-direction:column}#rw{flex:0 0 auto;max-height:40vh}}
button.op{min-width:48px;font-size:1.3rem;font-weight:700}
button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
#n5{width:70px;text-align:center;font-size:1.2rem}
.rk{display:flex;flex-direction:column;gap:10px}
#rk{flex:1 1 0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
#rk.gone{display:none}
.rkh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rkh b{font-size:1.15rem;margin-right:6px}
button.pill{border-radius:20px;padding:6px 16px;font-weight:700}
button.pill.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
button.pill.done{border-color:var(--ok);color:var(--ok)}
button.pill.cur.done{color:#fff;background:var(--ok);border-color:var(--ok)}
.rkt{font-size:clamp(1rem,2.4vh,1.2rem);line-height:1.4}
.rkrows{display:flex;flex-direction:column;gap:6px;align-self:flex-start;min-width:min(100%,520px)}
.rkr{display:grid;grid-template-columns:minmax(120px,max-content) max-content max-content;column-gap:10px;align-items:center;text-align:left;font-size:clamp(1.15rem,3.3vh,1.75rem);font-variant-numeric:tabular-nums;padding:6px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font-weight:500;cursor:pointer;justify-content:start}
.rkr.start{cursor:default;background:var(--soft)}
.rkr .l{text-align:right}
.rkr .o{color:var(--bad);font-weight:700;font-size:.85em;padding-left:4px;min-width:90px}
.rkr.badr{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.rkr.okr{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.rkmain{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.rkside{flex:1 1 300px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rkrows.sm{min-width:0}.rkrows.sm .rkr{font-size:clamp(1rem,2.6vh,1.3rem);padding:3px 12px}
.rkmsg{min-height:1.4em;font-weight:700;font-size:1.05rem}
.rkmsg.ok{color:var(--ok)}.rkmsg.bad{color:var(--bad)}
.rkbox{padding:8px 12px;border:2px solid var(--ok);border-radius:10px;font-size:clamp(1rem,2.3vh,1.15rem);line-height:1.45}
.rkbox.w{border-color:var(--warn)}
#rkans{width:90px;text-align:center;font-size:1.3rem}
.hk{color:var(--bad)}.hw{color:var(--accent)}
.ht{width:100%;border-collapse:collapse;table-layout:fixed}
.ht th{font-size:.82rem;padding:3px 4px;border-bottom:2px solid var(--line);text-align:left}
.ht td{padding:0 6px;vertical-align:middle}
.ht th:nth-child(1),.ht td:nth-child(1){width:24%}.ht th:nth-child(2),.ht td:nth-child(2){width:29%}
.ht tr.sr td{border-top:1px solid var(--line)}
.ht .hc{font-size:clamp(.85rem,1.9vh,1.05rem);color:var(--fg);line-height:1.25}
.ht .hc b{font-weight:600;font-size:clamp(.85rem,1.9vh,1.05rem)}
.ht .arr{text-align:center;font-size:1.3rem;color:var(--accent);line-height:1}
.ht svg.mini{display:block;width:100%;max-width:clamp(150px,30vh,270px);height:auto;aspect-ratio:1000/215;margin:2px auto;flex:none;min-height:0}
.rb{display:grid;grid-template-columns:max-content max-content 1fr;column-gap:6px;align-items:center;font-size:clamp(.9rem,2.1vh,1.12rem);font-variant-numeric:tabular-nums;line-height:1.35;white-space:nowrap}
.rb .l{text-align:right}
.rw{color:var(--bad);font-weight:700}
.rb .o{color:var(--bad);font-weight:700;padding-left:2px;font-size:.95em}
.rb .n{font-size:0;color:var(--bad);white-space:normal;line-height:1.1;padding-left:6px}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle;font-size:.9em}
.fr i{font-style:normal;padding:0 2px}.fr i:first-child{border-bottom:1.5px solid currentColor}
html.ov .rb .n{font-size:.62rem}
.rb .ph,.ht .ph{opacity:.4;font-size:1.4rem}
.res{margin-top:6px;font-size:1.05rem}
.tip{margin-top:8px;font-size:clamp(.9rem,2.1vh,1.05rem);line-height:1.35;color:var(--accent)}
html.ov #task,html.ov #ctl,html.ov .scale{display:none}
html.ov .m5 #rw,html.ov #rw{flex:1 1 auto;max-height:none}
html.ov #steps{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:4px 18px;align-content:start}
html.ov #steps .side{grid-column:2;grid-row:1/span 2}
html.ov #steps .tip{grid-column:1;grid-row:2;margin-top:6px;align-self:start}
html.ov #steps .ht{grid-column:1;grid-row:1;align-self:start}
html.ov #steps .box{margin-top:0;font-size:clamp(.9rem,2.2vh,1.1rem)}
@media (max-width:900px){html.ov #steps{grid-template-columns:1fr}html.ov #steps .side,html.ov #steps .ht,html.ov #steps .tip{grid-column:1;grid-row:auto}}
svg.mini{flex:none;height:auto;min-height:0;margin:4px 0}
.m5 #rw{flex:0 0 clamp(400px,64%,760px)}
.blk{padding:6px 0;border-bottom:2px solid var(--line)}
.blk .hd{font-size:.95rem;font-weight:700;color:var(--accent)}
.blk .eq1{font-size:clamp(1rem,2.6vh,1.35rem);line-height:1.5;font-variant-numeric:tabular-nums}
.blk .eq1 .o{color:var(--accent);margin-left:10px}
.blk .ph{opacity:.5;font-style:italic}
.box{margin-top:8px;padding:8px 10px;border:2px solid var(--warn);border-radius:10px;font-size:1.05rem;line-height:1.4}
@media (prefers-reduced-motion:reduce){#beam{transition:none}}
</style>

<main>
<div class="card row" role="tablist" aria-label="Aufgabe wählen">
  <strong>Buch S. 81</strong>
  <button class="tab" role="tab" id="t1" aria-selected="true">Einführung</button>
  <button class="tab" role="tab" id="t2" aria-selected="false">Aufgabe 2</button>
  <button class="tab" role="tab" id="t3" aria-selected="false">Aufgabe 3</button>
  <button class="tab" role="tab" id="t4" aria-selected="false">Aufgabe 4</button>
  <button class="tab" role="tab" id="t6" aria-selected="false">Raketen</button>
  <button class="tab" role="tab" id="t5" aria-selected="false">Hefteintrag</button>
  <button id="tg">Gleichung ausblenden</button>
</div>
<div class="card" id="task"></div>

<div class="mid" id="mid">
  <div class="card scale">
    <div id="eq"></div>
    <svg viewBox="0 -25 1000 480" role="img" aria-label="Waage mit Würfeln und Kugeln">
      <g id="beam"><rect x="30" y="195" width="940" height="12" rx="6" fill="var(--beam)"/><g id="items"></g></g>
      <polygon points="500,215 435,425 565,425" fill="var(--stand)" stroke="var(--beam)" stroke-width="5" stroke-linejoin="round"/>
      <rect x="345" y="425" width="310" height="28" rx="8" fill="var(--pivot)"/>
      <circle cx="500" cy="200" r="24" fill="var(--pivot)" stroke="var(--beam)" stroke-width="5"/>
    </svg>
    <div id="stat"></div>
  </div>
  <div class="card" id="rw">
    <div class="rwh">Rechenweg</div>
    <div id="steps"></div>
    <div id="stock"></div>
    <div class="row"><button id="undo">↶ Zurück</button><button id="newb">Neu</button><button id="cnt" class="gone">Zählhilfe zeigen</button><button id="hidr" class="gone">Rechnung verdecken</button><button id="probe" class="gone">Probe zeigen</button><button id="merke" class="gone">Merke zeigen</button></div>
  </div>
</div>

<div class="card" id="ctl">
  <div class="row" id="ops">
    <span class="lab">Anzahl</span><input type="number" id="n" min="1" max="10" value="1" aria-label="Anzahl">
    <div class="grp lr"><b>Links</b>
      <button class="add" data-s="L" data-t="x" data-g="1">+ Würfel</button><button class="add" data-s="L" data-t="k" data-g="1">+ Kugel</button>
      <button class="rem" data-s="L" data-t="x" data-g="-1">− Würfel</button><button class="rem" data-s="L" data-t="k" data-g="-1">− Kugel</button></div>
    <div class="grp lr"><b>Rechts</b>
      <button class="add" data-s="R" data-t="x" data-g="1">+ Würfel</button><button class="add" data-s="R" data-t="k" data-g="1">+ Kugel</button>
      <button class="rem" data-s="R" data-t="x" data-g="-1">− Würfel</button><button class="rem" data-s="R" data-t="k" data-g="-1">− Kugel</button></div>
    <div class="grp"><b>Beide Seiten</b>
      <button class="add" data-s="B" data-t="x" data-g="1">+ Würfel</button><button class="add" data-s="B" data-t="k" data-g="1">+ Kugel</button>
      <button class="rem" data-s="B" data-t="x" data-g="-1">− Würfel</button><button class="rem" data-s="B" data-t="k" data-g="-1">− Kugel</button>
      <button class="p" id="div">Teilen durch Anzahl</button></div>
  </div>
  <div class="row gone" id="m5ctl">
    <div class="grp" id="opg"><b>Rechenbefehl</b><button class="op" data-o="+">+</button><button class="op" data-o="-">−</button><button class="op" data-o=":">:</button><button class="op" data-o="*">·</button></div>
    <input type="number" id="n5" min="1" max="10" value="1" aria-label="Zahl">
    <div class="grp" id="obg"><b>auf beiden Seiten</b><button class="ob" data-t="x">Würfel</button><button class="ob" data-t="k">Kugel</button></div>
    <button class="p" id="go5">Ausführen</button>
  </div>
  <div class="row" style="margin-top:6px">
    <span id="wrow1" class="row"><span class="lab">Ein Würfel (x) wiegt</span><input type="text" id="ans" inputmode="decimal" autocomplete="off" aria-label="Kugeln pro Würfel"><span class="lab">Kugeln</span><button class="p" id="chk">Prüfen</button><button id="show">Lösung zeigen</button></span>
    <span id="wrow4" class="row gone"><span class="lab">Ein Würfel (x) wiegt</span><input type="number" id="wset" min="1" max="10" value="3" aria-label="Würfelgewicht"><span class="lab">Kugeln</span><button class="p" id="hide">Verstecken</button></span>
    <span id="wrow5" class="row gone"><span class="lab">Würfelgewicht ist versteckt.</span><button id="unhide">Aufdecken</button></span>
    <span id="msg"></span>
  </div>
</div>
<div class="card gone" id="rk"></div>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var EX=[[1,2,0,5,3],[2,1,0,7,3],[3,2,1,8,3],[0,4,1,1,3],[2,3,1,7,4]],exi=0,showCnt=false;
var CFG={
 1:{L:[0,0],R:[0,0],w:3,total:null,text:'<b>Einführung</b> Die Waage ist im Gleichgewicht. Ein Würfel hat ein unbekanntes Gewicht x, eine Kugel wiegt 1. Wie viele Würfel und wie viele Kugeln liegen links, wie viele rechts? Schreibe die Gleichung auf. Finde dann heraus, wie viele Kugeln ein Würfel wiegt, und trage die Zahl ein.<br><span class="hf">✎ Übungsheft: Schreibe die Gleichung und deine Rechnung in dein Übungsheft.</span>'},
 2:{L:[3,2],R:[1,8],w:3,total:null,text:'<b>Aufgabe 2</b> a) Leere die Waagschalen gleichmäßig, bis links nur noch ein Würfel und keine Kugel liegt. b) Wie viele Kugeln wiegen so viel wie ein Würfel? Erkläre, wie du die Lösung gefunden hast. c) Schreibe zu jedem Schritt eine Gleichung mit Umformung.<br><span class="hf">✎ Übungsheft: Schreibe deine Gleichungen und deine Erklärung in dein Übungsheft.</span>'},
 3:{L:[0,4],R:[1,1],w:3,total:[7,15],text:'<b>Aufgabe 3</b> Die Waage ist im Gleichgewicht. Lege schrittweise möglichst viele Würfel und Kugeln auf (insgesamt 7 Würfel und 15 Kugeln). Die Waage muss immer im Gleichgewicht bleiben. Erkläre dein Vorgehen und vergleiche mit deinem Partner.<br><span class="hf">✎ Übungsheft: Schreibe auf, wie du vorgegangen bist.</span>'},
 5:{L:[4,2],R:[1,8],w:2,total:null,text:'<b>Hefteintrag:</b> 4 Würfel und 2 Kugeln wiegen genau so viel wie 1 Würfel und 8 Kugeln. Wie viele Kugeln sind so schwer wie ein Würfel? Löst die Waage Schritt für Schritt, bis x links auf der Waage alleine steht. Sagt zu jedem Schritt: Was machen wir? Wie lautet die Rechnung?'},
 4:{L:[0,0],R:[0,0],w:3,total:null,text:'<b>Aufgabe 4</b> Erfinde ein eigenes Rätsel: Wähle, wie viele Kugeln ein Würfel wiegt, und baue eine Waage im Gleichgewicht. Verstecke das Würfelgewicht und tausche mit deinem Partner. Löse das Rätsel deines Partners. Überlege: Was sollte man sich als Erstes überlegen, wenn man ein Rätsel aufstellt?<br><span class="hf">✎ Übungsheft: Schreibe dein Rätsel als Gleichung, den Rechenweg deines Partners und deine Überlegung in dein Übungsheft.</span>'}
};
var op5='',ob5='',rechHid=false,probeOn=false,merkeOn=false;
var mode=1,S,w,H,hidW,rev,eqHid=false;
function snap(){return {L:{x:S.L.x,k:S.L.k},R:{x:S.R.x,k:S.R.k}}}
function init(m){
  mode=m;var c=CFG[m];
  ['task','mid','ctl','tg'].forEach(function(id){$(id).classList.toggle('gone',m===6)});$('rk').classList.toggle('gone',m!==6);
  if(m===6){document.documentElement.classList.remove('ov');['t1','t2','t3','t4','t6','t5'].forEach(function(id){$(id).setAttribute('aria-selected',String(id==='t6'))});rkDraw();return}
  $('ops').classList.toggle('gone',m===1);$('cnt').classList.toggle('gone',m!==1);
  $('undo').textContent='↶ Zurück';$('newb').textContent='Neu';$('rw').firstElementChild.textContent=m===5?'7. So löst du Gleichungen mit der Äquivalenzumformung':'Rechenweg';
  $('mid').classList.toggle('m5',m===5);document.documentElement.classList.remove('ov');rechHid=false;probeOn=false;merkeOn=false;
  ['hidr','probe','merke'].forEach(function(id){$(id).classList.toggle('gone',m!==5)});$('hidr').textContent='Rechnung verdecken';
  $('ops').classList.toggle('gone',m===5);$('m5ctl').classList.toggle('gone',m!==5);op5='';ob5='';Array.prototype.forEach.call(document.querySelectorAll('.op,.ob'),function(b){b.classList.remove('sel')});
  S={L:{x:c.L[0],k:c.L[1]},R:{x:c.R[0],k:c.R[1]}};
  w=c.w;
  if(m===1){var e=EX[exi];S={L:{x:e[0],k:e[1]},R:{x:e[2],k:e[3]}};w=e[4];eqHid=true;showCnt=false}else{eqHid=false}
  $('tg').textContent=eqHid?'Gleichung zeigen':'Gleichung ausblenden';rev=false;hidW=(m!==4);
  H=[{s:snap(),op:'',warn:false}];
  ['t1','t2','t3','t4','t6','t5'].forEach(function(id){$(id).setAttribute('aria-selected',String(id==='t'+m))});
  $('task').innerHTML=c.text;$('msg').textContent='';$('msg').className='';$('ans').value='';
  if(m===4)$('wset').value=3;
  draw(true);
}
function bal(){return (S.L.x-S.R.x)*w+(S.L.k-S.R.k)}
function term(a,b){var p=[];if(a>0)p.push((a===1?'':a)+'x');if(b>0)p.push(b);return p.length?p.join(' + '):'0'}
function eqOf(s,eq){return term(s.L.x,s.L.k)+(eq?' = ':' <span class="ne">≠</span> ')+term(s.R.x,s.R.k)}
function balOf(s){return (s.L.x-s.R.x)*w+(s.L.k-s.R.k)===0}
function side(a,b,x0,lab){
  var g=10,BW=76,BD=38,rows=b>30?6:(b>12?4:3),cols=Math.ceil(b/rows);
  var W=a*(BW+g)+cols*(BD+6),s=Math.min(1,W>0?430/W:1,170/(rows*(BD+4)));
  var bw=BW*s,bh=84*s,bd=BD*s,gp=g*s,wd=a*(bw+gp)+cols*(bd+6*s),fz=54*s*(lab.length>4?.5:(lab.length>2?.68:1));
  var sx=x0<500?470-wd:530,out='';
  for(var i=0;i<a;i++){var bx=sx+i*(bw+gp);
    out+='<rect x="'+bx+'" y="'+(195-bh)+'" width="'+bw+'" height="'+bh+'" rx="'+(14*s)+'" fill="var(--blk)" stroke="var(--blks)" stroke-width="'+(4*s)+'"/>'+
    '<text x="'+(bx+bw/2)+'" y="'+(195-bh/2+18*s)+'" text-anchor="middle" font-size="'+fz+'" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">'+lab+'</text>';}
  for(var j=0;j<b;j++){var col=Math.floor(j/rows),row=j%rows;
    out+='<circle cx="'+(sx+a*(bw+gp)+col*(bd+6*s)+bd/2)+'" cy="'+(195-bd/2-row*(bd+4*s))+'" r="'+(bd/2)+'" fill="var(--ball)" stroke="var(--balls)" stroke-width="'+(3*s)+'"/>';}
  return out;
}
function used(){var c=CFG[mode].total;if(!c)return null;return {x:c[0]-S.L.x-S.R.x,k:c[1]-S.L.k-S.R.k}}

  $('wrow4').classList.toggle('gone',!(mode===4&&!hidW));

function miniSvg(s){return '<svg viewBox="0 20 1000 215" class="mini" role="img" aria-label="Waage"><rect x="30" y="195" width="940" height="10" rx="5" fill="var(--beam)"/>'+side(s.L.x,s.L.k,40,'x')+side(s.R.x,s.R.k,530,'x')+'<polygon points="500,205 455,235 545,235" fill="var(--stand)"/></svg>'}
function wrapT(t){return t.indexOf(' + ')>=0?'('+t+')':t}
function tafel(){
  var fin=H[H.length-1].s,solved=(fin.L.x===1&&fin.L.k===0&&fin.R.x===0),n=H.length,
  fr=function(a,b){return '<span class="fr"><i>'+a+'</i><i>'+b+'</i></span>'},
  h='<table class="ht"><tr><th>Handlung:</th><th>Darstellung am Waagemodell:</th><th>Rechnung:</th></tr>';
  for(var i=0;i<n;i++){

      var cls='',nt,o1,l2L,l2R;

      else{var sg=d.g>0?'+':'−',nm=d.t==='x'?(d.k===1?'x':d.k+'x'):String(d.k);
        hand='Links und rechts je '+(d.t==='x'?(d.k===1?'1 Würfel':d.k+' Würfel'):(d.k===1?'1 Kugel':d.k+' Kugeln'))+(d.g>0?' dazulegen':' wegnehmen');
        cls=d.t==='x'?'hw':'hk';o1='| '+sg+' '+nm;nt='(auf beiden Seiten '+sg+' '+nm+')';l2L=L+' <span class="rw">'+sg+' '+nm+'</span>';l2R=R+' <span class="rw">'+sg+' '+nm+'</span>'}
      hand='<span class="'+cls+'">'+hand+'</span>';
      rb='<span class="l">'+L+'</span><span class="r">= '+R+'</span><span class="o">'+o1+'</span>'+
         '<span class="l">'+l2L+'</span><span class="r">= '+l2R+'</span><span class="n">'+nt+'</span>'+
         '<span class="l">'+L2+'</span><span class="r">= '+R2+'</span><span></span>';

    }

  if(probeOn){var s0=H[0].s,w0=fin.R.k,pj=function(p,q){return p.concat(q).filter(function(x){return x!==''}).join(' + ')||'0'},
    f1=function(q){return pj(q.x>0?[q.x===1?''+w0:q.x+' · '+w0]:[],q.k>0?[''+q.k]:[])},
    f2=function(q){return pj(q.x>0?[''+(q.x*w0)]:[],q.k>0?[''+q.k]:[])},
    f3=function(q){return q.x*w0+q.k};
    h+='<div class="box">'+(solved?'<b>Probe</b> mit x = '+w0+'<br>'+term(s0.L.x,s0.L.k)+' = '+term(s0.R.x,s0.R.k)+' <small>(Anfangsgleichung)</small><br>'+f1(s0.L)+' = '+f1(s0.R)+' <small>(x einsetzen)</small><br>'+f2(s0.L)+' = '+f2(s0.R)+'<br>'+f3(s0.L)+' = '+f3(s0.R)+' ✓':'Löse zuerst die Gleichung, dann kannst du die Probe machen.')+'</div>'}
  if(merkeOn)h+='<div class="box"><b>Merke</b> So löst du eine Gleichung:<br>1. <b>Zuerst vereinfachen:</b> Gleiches auf jeder Seite zusammenfassen (z. B. x zu x, Zahlen zu Zahlen).<br>2. <b>Dann umformen:</b> Auf beiden Seiten das Gleiche rechnen, bis x ganz allein steht (das nennt man <b>Äquivalenzumformung</b>).<br>3. Am Ende steht da <b>x = Ergebnis</b> (nicht −x).<br>4. <b>Probe:</b> x in die Anfangsgleichung einsetzen. Kommt links und rechts das Gleiche raus, stimmt es.</div>';
  h+='</div>';
  if(merkeOn)h+='<div class="tip"><b>Wichtig:</b> Eine Gleichung ist wie eine Waage – sie muss immer im Gleichgewicht sein. Darum gilt: Was links gerechnet wird, muss auch rechts gerechnet werden (z. B. links 2 abziehen → rechts auch 2 abziehen).</div>';
  document.documentElement.classList.toggle('ov',solved&&merkeOn);
  $('steps').innerHTML=h;$('steps').scrollTop=(solved&&merkeOn)?0:1e6;
  $('hidr').textContent=rechHid?'Rechnung zeigen':'Rechnung verdecken';
  $('merke').textContent=merkeOn?'Merke ausblenden':'Merke zeigen';
  $('probe').textContent=probeOn?'Probe ausblenden':'Probe zeigen';
  $('wrow1').classList.remove('gone');$('wrow4').classList.add('gone');$('wrow5').classList.add('gone');
}

  $('ops').classList.add('gone');$('wrow1').classList.remove('gone');$('wrow4').classList.add('gone');$('wrow5').classList.add('gone');$('cnt').classList.remove('gone');
  $('undo').textContent='← Vorherige';$('newb').textContent='Nächste Waage →';$('cnt').textContent=showCnt?'Zählhilfe ausblenden':'Zählhilfe zeigen';

  if(showCnt)h+='<div class="st last"><span>Links: '+S.L.x+' Würfel, '+S.L.k+' Kugeln</span></div><div class="st last"><span>Rechts: '+S.R.x+' Würfel, '+S.R.k+' Kugeln</span></div>';

function n(){var v=parseInt($('n').value,10);if(isNaN(v)||v<1)v=1;if(v>10)v=10;return v}
function say(t,bad){$('msg').textContent=t;$('msg').className=bad?'bad':''}
function act(sd,t,g){
  var k=n(),sides=sd==='B'?['L','R']:[sd],i,cap=(t==='x'?10:60);
  for(i=0;i<sides.length;i++){var v=S[sides[i]][t]+g*k;
    if(v<0){say('So viel liegt dort nicht auf der Waage.',true);return}
    if(v>cap){say('Auf eine Waagschale passen höchstens '+cap+(t==='x'?' Würfel.':' Kugeln.'),true);return}}
  var sv=used();
  if(sv&&g>0&&sv[t]<k*sides.length){say('Dafür sind nicht genug '+(t==='x'?'Würfel':'Kugeln')+' übrig.',true);return}
  var nm=t==='x'?(k===1?'x':k+'x'):String(k),sg=g>0?'+':'−',op;
  sides.forEach(function(s){S[s][t]+=g*k});
  if(sd==='B')op='| '+sg+' '+nm;else op=(sd==='L'?'nur links ':'nur rechts ')+sg+' '+nm;
  H[H.length-1].op=op;H[H.length-1].warn=(sd!=='B');H[H.length-1].det={sd:sd,t:t,g:g,k:k};
  H.push({s:snap(),op:'',warn:false});say('');draw();
}
function divide(){
  var k=n();if(k<2){say('Wähle eine Anzahl ab 2 zum Teilen.',true);return}
  if([S.L.x,S.L.k,S.R.x,S.R.k].some(function(v){return v%k!==0})){say('Das geht nicht auf: Würfel und Kugeln lassen sich nicht ganz in '+k+' gleiche Teile teilen.',true);return}
  ['L','R'].forEach(function(s){S[s].x/=k;S[s].k/=k});
  H[H.length-1].op='| : '+k;H[H.length-1].warn=false;H[H.length-1].det={div:k};H.push({s:snap(),op:'',warn:false});say('');draw();
}
function mul(k){
  if(k<2){say('Wähle eine Zahl ab 2 zum Malnehmen.',true);return}
  var ok=['L','R'].every(function(sd){return S[sd].x*k<=10&&S[sd].k*k<=60});
  if(!ok){say('Dann liegen zu viele Würfel oder Kugeln auf der Waage.',true);return}
  ['L','R'].forEach(function(sd){S[sd].x*=k;S[sd].k*=k});
  H[H.length-1].op='| · '+k;H[H.length-1].warn=false;H[H.length-1].det={mul:k};H.push({s:snap(),op:'',warn:false});say('');draw();
}
function go5(){
  var v=parseInt($('n5').value,10);if(isNaN(v)||v<1)v=1;if(v>10)v=10;$('n5').value=v;

}

var RK=[
{eq:'5x + 4 = 2x + 13',q:[5,4,2,13],w:3,wx:6,bad:3,rows:[['5x + 4 = 2x + 13','| − 4'],['5x = 2x + 9','| − 2x'],['3x = 9','| : 3'],['x = 6','']],fix:[['3x = 9','| : 3'],['x = 3','']],why:'9 : 3 = 3, nicht 6. Nach dem Teilen durch 3 bleibt 1 Würfel gleich 3 Kugeln.'},
{eq:'4x + 6 = x + 21',q:[4,6,1,21],w:5,wx:7,bad:1,rows:[['4x + 6 = x + 21','| − 6'],['4x = x + 21','| − x'],['3x = 21','| : 3'],['x = 7','']],fix:[['4x = x + 15','| − x'],['3x = 15','| : 3'],['x = 5','']],why:'Das − 6 gilt auf beiden Seiten. Rechts wurde es vergessen: 21 − 6 = 15.'},
{eq:'3x + 2x + 4 = 34',q:[5,4,0,34],w:6,wx:5,bad:1,rows:[['3x + 2x + 4 = 34','vereinfachen'],['6x + 4 = 34','| − 4'],['6x = 30','| : 6'],['x = 5','']],fix:[['5x + 4 = 34','| − 4'],['5x = 30','| : 5'],['x = 6','']],why:'3x + 2x sind 5x, nicht 6x. 3 Würfel und 2 Würfel sind zusammen 5 Würfel.'},
{eq:'5x − 6 = 2x + 15',q:[5,-6,2,15],w:7,wx:3,bad:1,rows:[['5x − 6 = 2x + 15','| + 6'],['5x = 2x + 9','| − 2x'],['3x = 9','| : 3'],['x = 3','']],fix:[['5x = 2x + 21','| − 2x'],['3x = 21','| : 3'],['x = 7','']],why:'Hier wird + 6 gerechnet, nicht − 6: 15 + 6 = 21.'}

var rkI=0,rkS=RK.map(function(){return{found:false,solved:false,sol:false,pr:false,msg:'',cls:'',ans:''}});
function rkSide(a,b,x){var p=(a===1?''+x:a+' · '+x);return a===0?''+b:p+(b>0?' + '+b:(b<0?' − '+(-b):''))}
function rkProbe(r,x){var q=r.q,L=q[0]*x+q[1],R=q[2]*x+q[3];

function rkDraw(){
  var r=RK[rkI],st=rkS[rkI],h='<div class="rkh"><b>🚀 Raketen-Check</b>';
  var ctrl='<div class="row"><span class="lab">Richtig ist: Ein Würfel (x) wiegt</span><input type="text" id="rkans" inputmode="decimal" autocomplete="off" value="'+st.ans+'"><span class="lab">Kugeln</span><button class="p" data-a="chk">Prüfen</button><button data-a="pr">Probe mit x = '+r.wx+'</button><button data-a="sol">Lösungsweg zeigen</button></div>';

    side+='<div class="rkbox"><b>So geht es richtig:</b><div class="rkrows sm" style="margin-top:6px">';
    side+='<div class="rkr okr"><span class="l">'+r.rows[r.bad-1][0].split(' = ')[0]+'</span><span class="r">= '+r.rows[r.bad-1][0].split(' = ')[1]+'</span><span class="o">'+r.rows[r.bad-1][1]+'</span></div>';
    r.fix.forEach(function(row){var p=row[0].split(' = ');side+='<div class="rkr okr"><span class="l">'+p[0]+'</span><span class="r">= '+p[1]+'</span>'+(row[1]?'<span class="o">'+row[1]+'</span>':'<span></span>')+'</div>'});

$('rk').onclick=function(e){
  var t=e.target.closest('[data-r],[data-i],[data-a]');if(!t)return;var r=RK[rkI],st=rkS[rkI];
  var inp=$('rkans');if(inp)st.ans=inp.value;
